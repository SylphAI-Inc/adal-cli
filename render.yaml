services:
  # Docusaurus Documentation Site
  - type: web
    name: adal-cli-docs
    runtime: static
    buildCommand: cd docs-site && npm install && npm run build
    staticPublishPath: docs-site/build
    pullRequestPreviewsEnabled: true
    autoDeploy: true  # Automatically deploy on push to connected branch
    branch: main      # Or specify your default branch
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production